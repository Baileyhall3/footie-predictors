name: Send Predictions Reminders

on:
  schedule:
    - cron: "*/15 * * * *"  # Runs every 15 minutes

jobs:
  send-predictions-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call API to send predictions reminders
        run: curl -X GET https://www.footiepredictors.com/api/sendPredictionsReminders
